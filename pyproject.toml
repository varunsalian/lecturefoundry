[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursera-lectures"
version = "0.1.0"
description = "Turn course transcripts into structured, accessible HTML study pages."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Varun Salian"},
]
keywords = ["coursera", "transcripts", "education", "html", "ollama", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
dependencies = [
  "coursera-transcripts==0.1.6",
  "requests>=2.31",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
coursera-lectures = "coursera_lectures.cli:main"

[project.urls]
Homepage = "https://github.com/varunsalian/coursera-lectures"
Repository = "https://github.com/varunsalian/coursera-lectures"
Issues = "https://github.com/varunsalian/coursera-lectures/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
