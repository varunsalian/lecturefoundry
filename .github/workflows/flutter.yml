name: Flutter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lecturefoundry

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lecturefoundry
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug

  linux-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lecturefoundry
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev ninja-build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build linux --debug

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/lecturefoundry
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --debug

  apple-builds:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/lecturefoundry
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug
      - name: Configure macOS project
        run: flutter build macos --config-only
      - name: Compile unsigned macOS app
        run: >-
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner
          -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS= build
